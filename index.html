<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena - Tournament System</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --neon-purple: #bc13fe;
            --neon-blue: #0ff;
            --dark-bg: #050505;
            --border-thin: 1px solid rgba(255, 255, 255, 0.1);
            --glow-strength: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .scanner-bar {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to bottom, transparent, var(--neon-blue), transparent);
            box-shadow: 0 0 25px var(--neon-blue), 0 0 10px #fff; 
            opacity: 0.8; 
            animation: scan 4s linear infinite;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
            background: var(--dark-bg); 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            font-weight: 400;
            line-height: 1.5;
        }
        
        #laser-container { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; 
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%); 
            overflow: hidden; 
        }

        .grid-line {
            position: absolute;
            background: rgba(0, 255, 255, 0.12);
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.05);
        }

        .targeting-reticle {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid var(--neon-purple);
            border-radius: 4px;
            opacity: 0;
            filter: drop-shadow(0 0 8px var(--neon-purple));
            animation: target 8s ease-in-out infinite;
        }

        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes target { 0%, 100% { opacity: 0; transform: scale(0.8); } 50% { opacity: 0.2; transform: scale(1.1); } }

        #splash { position: fixed; inset: 0; background: black; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        .init-btn { 
            background: rgba(0, 255, 255, 0.05); 
            color: var(--neon-blue); 
            border: 1px solid var(--neon-blue); 
            padding: 12px 30px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 500;
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .init-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }

        .nav-bar { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(188, 19, 254, 0.3);
            display: none; align-items: center; justify-content: center; gap: 40px; z-index: 1000;
        }
        .nav-btn { 
            background: none; border: none; color: #aaa; font-weight: 500; 
            cursor: pointer; text-transform: uppercase; padding: 5px 0; 
            transition: 0.3s; font-size: 0.9rem; letter-spacing: 1px;
        }
        .nav-btn.active { color: var(--neon-blue); border-bottom: 1px solid var(--neon-blue); }

        .admin-bar { position: fixed; top: 70px; right: 20px; display: none; gap: 8px; z-index: 1000; background: rgba(10,10,10,0.9); padding: 8px; border-radius: 4px; border: var(--border-thin); }
        .admin-bar input { width: 60px; background: #000; border: 1px solid #333; color: #fff; padding: 4px; font-size: 12px; }

        .screen { display: none; padding: 100px 40px 40px 40px; animation: fadeIn 0.4s ease-in; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .bracket-wrapper { display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .round-container { display: flex; gap: 40px; margin-top: 20px; }
        .matchup { 
            background: rgba(20, 20, 25, 0.6); 
            border: 1px solid #222; 
            padding: 12px; 
            border-radius: 4px; 
            margin-bottom: 15px;
            min-width: 200px;
        }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"] { 
            width: 90%; padding: 8px; background: rgba(0,0,0,0.5); 
            border: 1px solid #333; color: var(--neon-blue); 
            font-weight: 400; border-radius: 2px; font-size: 13px; outline: none; 
            transition: 0.2s;
        }
        input:focus { border-color: var(--neon-purple); background: #000; }

        .register-box { 
            position: fixed; bottom: 30px; right: 30px; width: 220px; 
            background: rgba(5, 5, 10, 0.9); padding: 20px; border-radius: 4px; 
            border: 1px solid var(--neon-purple); z-index: 1001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            transition: all 0.3s ease;
        }
        .register-box.minimized {
            height: 30px;
            width: 150px;
            padding: 10px;
            overflow: hidden;
        }
        .min-toggle {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: var(--neon-purple);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        .reg-btn { background: var(--neon-purple); color: #fff; width: 100%; padding: 10px; font-weight: 500; border: none; margin-top: 10px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }

        h1 { font-size: 2.5rem; font-weight: 300; letter-spacing: 8px; margin-bottom: 0.5rem; }
        h2 { color: var(--neon-purple); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 400; border-left: 2px solid var(--neon-purple); padding-left: 15px; margin-bottom: 25px; }
        h3 { font-size: 11px; color: #555; text-transform: uppercase; margin: 10px 0; font-weight: 600; letter-spacing: 1px; }
        .glow-p { color: #fff; text-shadow: 0 0 10px rgba(188, 19, 254, 0.5); }
        
        .win-btn, .lose-btn { font-weight: 500; font-size: 10px; border-radius: 2px; }
        table { border-collapse: collapse; }
        th { font-weight: 500; font-size: 0.9rem; color: var(--neon-blue); text-align: left; padding: 10px; border-bottom: 1px solid #222; }
        td { padding: 10px; border-bottom: 1px solid #111; font-size: 0.9rem; }
    </style>
</head>
<body id="mainBody">

<div id="laser-container">
    <div class="scanner-bar"></div>
</div>

<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
</audio>

<div id="splash">
    <h1 class="glow-p">BLAST WARFARE</h1>
    <p style="font-weight: 300; letter-spacing: 4px; font-size: 0.8rem; color: #666;">ARGOS TECHNOLOGY // TACTICAL OVERLAY</p>
    <button class="init-btn" onclick="init()">Initialize System</button>
</div>

<div class="nav-bar" id="mainNav">
    <div style="position: absolute; left: 30px; color: var(--neon-purple); font-weight: 300; letter-spacing: 4px; font-size: 0.8rem;">ARGOS_v2.0</div>
    <button class="nav-btn active" id="btn-bracket" onclick="showScreen('bracket-screen')">Combat Bracket</button>
    <button class="nav-btn" id="btn-leaderboard" onclick="showScreen('leaderboard-screen')">Squad Rankings</button>
</div>

<div class="admin-bar" id="adminBar">
    <input type="password" id="passInput" placeholder="password">
    <button onclick="checkPass()" style="background:#222; border:none; color:white; cursor:pointer; padding:5px 10px; font-size:10px;">AUTH</button>
    <div class="admin-only" style="gap:5px; align-items:center; display:none;">
        <input type="number" id="maxTeamsInput" value="4" style="width:35px">
        <button onclick="updateConfig()" style="background:var(--neon-blue); border:none; padding:5px; cursor:pointer; font-size:10px;">SET</button>
        <button onclick="nukeAll()" style="background:#300; color:red; border:1px solid red; padding:5px; font-size:10px; cursor:pointer;">WIPE</button>
    </div>
</div>

<div id="bracket-screen" class="screen active-screen">
    <div class="bracket-wrapper" id="dynamic-bracket-area"></div>
</div>

<div id="leaderboard-screen" class="screen">
    <div class="leaderboard-container" style="max-width: 600px; margin: auto;">
        <h2 style="color:var(--neon-blue); border-color:var(--neon-blue)">Rankings</h2>
        
        <div class="admin-only" style="display:none; flex-direction:column; gap:10px; margin-bottom:20px; padding:15px; border:1px solid var(--neon-blue); background:rgba(0,255,255,0.05);">
            <h3 style="color:var(--neon-blue); margin-top:0;">Manual Rank Override</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="newRankTeam" placeholder="Team Name" style="flex:2">
                <input type="number" id="newRankWins" placeholder="Wins" style="flex:1">
                <button onclick="addRankedTeam()" style="background:var(--neon-blue); color:black; border:none; padding:5px 15px; cursor:pointer; font-weight:bold; font-size:10px;">ADD/UPDATE</button>
            </div>
        </div>

        <table style="width:100%">
            <thead><tr><th>Rank</th><th>Team</th><th>Wins</th><th>Actions</th></tr></thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>
</div>

<div class="register-box" id="regBox">
    <button class="min-toggle" onclick="toggleMin()">▼</button>
    <h3 style="margin:0 0 15px 0; color:var(--neon-purple); text-align:center;">SQUAD ENROLLMENT</h3>
    <div id="regContent">
        <input type="text" id="regTeamName" placeholder="Callsign" style="margin-bottom:8px; width:90%;">
        <input type="email" id="regEmail" placeholder="Comms Email" style="margin-bottom:8px; width:90%;">
        <input type="password" id="regPass" placeholder="Access Code" style="margin-bottom:8px; width:90%;">
        <button class="reg-btn" onclick="registerTeam()">Deploy Squad</button>
        <div class="spots-counter" id="spotsLeft" style="font-size:9px; margin-top:10px; text-align:center; color:#555;">SCANNING SLOTS...</div>
    </div>
</div>

<script>
    const music = document.getElementById('bgMusic');
    
    function toggleMin() {
        const box = document.getElementById('regBox');
        const content = document.getElementById('regContent');
        const btn = document.querySelector('.min-toggle');
        if(box.classList.contains('minimized')) {
            box.classList.remove('minimized');
            content.style.display = 'block';
            btn.innerText = '▼';
        } else {
            box.classList.add('minimized');
            content.style.display = 'none';
            btn.innerText = '▲';
        }
    }

    function createGrid() {
        const container = document.getElementById('laser-container');
        for(let i=0; i<25; i++) {
            let line = document.createElement('div');
            line.className = 'grid-line';
            line.style.width = '1px';
            line.style.height = '100%';
            line.style.left = (i * 4) + '%';
            container.appendChild(line);
        }
        for(let i=0; i<6; i++) {
            let target = document.createElement('div');
            target.className = 'targeting-reticle';
            target.style.top = Math.random() * 80 + '%';
            target.style.left = Math.random() * 80 + '%';
            target.style.animationDelay = (i * 1.5) + 's';
            container.appendChild(target);
        }
    }

    function init() {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('mainNav').style.display = 'flex';
        document.getElementById('adminBar').style.display = 'flex';
        document.getElementById('regBox').style.display = 'block';
        createGrid();
        music.volume = 0.15;
        music.play().catch(() => console.log("Audio blocked"));
    }

    // FIREBASE CONFIG
    const firebaseConfig = {
    apiKey: "AIzaSyATnD8WrsBG7mj31pvuNTQPNkVfR1B4Eso",
    authDomain: "bracketserver-94d6e.firebaseapp.com",
    databaseURL: "https://bracketserver-94d6e-default-rtdb.firebaseio.com",
    projectId: "bracketserver-94d6e",
    storageBucket: "bracketserver-94d6e.firebasestorage.app",
    messagingSenderId: "1065482622043",
    appId: "1:1065482622043:web:919883d7710bc226e05b7e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    let isAdmin = false;
    let currentConfig = { maxTeams: 4 };

    auth.onAuthStateChanged(async (user) => {
        if (user && user.emailVerified) {
            const pendingRef = db.ref('pending/' + user.uid);
            const snapshot = await pendingRef.get();
            const data = snapshot.val();
            if (data && data.registered === false) {
                const bSnap = await db.ref('bracket').get();
                const bData = bSnap.val() || {};
                const firstRoundMatches = currentConfig.maxTeams / 2;
                let foundSlot = null;
                for(let m=1; m <= firstRoundMatches; m++) {
                    if(!bData[`w1-m${m}-t1`]) { foundSlot = `w1-m${m}-t1`; break; }
                    if(!bData[`w1-m${m}-t2`]) { foundSlot = `w1-m${m}-t2`; break; }
                }
                if (foundSlot) {
                    await db.ref('bracket/' + foundSlot).set(data.team);
                    await pendingRef.update({ registered: true });
                    alert("Deployment Successful: " + data.team + " is in the bracket.");
                } else {
                    alert("Tournament at capacity.");
                }
            }
        }
    });

    function renderBracket(data) {
        const area = document.getElementById('dynamic-bracket-area');
        area.innerHTML = '';
        createSection(area, "Winners Circle", "w", data, false);
        createSection(area, "Redemption", "l", data, true);
        
        const gfHeader = document.createElement('h2'); 
        gfHeader.innerText = "Grand Final"; 
        gfHeader.style.borderColor = "white";
        area.appendChild(gfHeader);
        
        const gfBox = document.createElement('div'); 
        gfBox.className = "matchup"; 
        gfBox.style.width = "280px";
        gfBox.innerHTML = `
            <div class="slot"><input type="text" id="gf-t1" value="${data['gf-t1']||''}" placeholder="Winner Side" onchange="updateDb('gf-t1', this.value)"></div>
            <div style="text-align:center; font-size:10px; color:#444; margin:10px 0; letter-spacing:2px;">TERMINATION PHASE</div>
            <div class="slot"><input type="text" id="gf-t2" value="${data['gf-t2']||''}" placeholder="Loser Side" onchange="updateDb('gf-t2', this.value)"></div>
        `;
        area.appendChild(gfBox);
        checkRegStatus(data);
    }

    function createSection(parent, title, prefix, data, isLosers) {
        const h = document.createElement('h2'); h.innerText = title; parent.appendChild(h);
        const container = document.createElement('div'); container.className = 'round-container';
        const totalRds = Math.log2(currentConfig.maxTeams);
        const loopRds = isLosers ? totalRds - 1 : totalRds;
        for(let r=1; r<=loopRds; r++) {
            const rd = document.createElement('div'); rd.className = 'round';
            rd.innerHTML = `<h3>Round ${r}</h3>`;
            const matches = Math.pow(2, totalRds - r) / (isLosers ? 2 : 1);
            for(let m=1; m<=Math.max(matches, 1); m++) {
                const mid = `${prefix}${r}-m${m}`;
                const mDiv = document.createElement('div'); mDiv.className = 'matchup';
                [1,2].forEach(t => {
                    const id = `${mid}-t${t}`;
                    const slot = document.createElement('div'); slot.className = 'slot';
                    slot.style.display = 'flex';
                    slot.style.alignItems = 'center';
                    slot.style.gap = '5px';
                    let nextM = Math.ceil(m/2); let nextT = (m % 2 === 0) ? 2 : 1;
                    let winPath = (r === loopRds) ? (isLosers ? "gf-t2" : "gf-t1") : `${prefix}${r+1}-m${nextM}-t${nextT}`;
                    let losePath = `l1-m${m}-t${t}`;
                    slot.innerHTML = `
                        <input type="text" id="${id}" value="${data[id]||''}" onchange="updateDb('${id}', this.value)">
                        <div class="admin-only" style="display:${isAdmin?'flex':'none'}; gap:2px;">
                            <button class="win-btn" style="background:#0a4; color:white; border:none; padding:4px; cursor:pointer;" onclick="move('${id}', '${winPath}')">W</button>
                            ${!isLosers ? `<button class="lose-btn" style="background:#822; color:white; border:none; padding:4px; cursor:pointer;" onclick="move('${id}', '${losePath}')">L</button>` : ''}
                        </div>
                    `;
                    mDiv.appendChild(slot);
                    if(t===1) mDiv.innerHTML += `<div style="height:8px"></div>`;
                });
                rd.appendChild(mDiv);
            }
            container.appendChild(rd);
        }
        parent.appendChild(container);
    }

    function checkPass() {
        if(document.getElementById('passInput').value === "strider101") {
            isAdmin = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'flex');
            // Refresh visuals
            db.ref('leaderboard').once('value', snap => renderLeaderboard(snap.val() || {}));
            alert("Admin Access Authorized");
        }
    }

    function move(from, to) { if(isAdmin) db.ref('bracket/'+to).set(document.getElementById(from).value); }
    function updateDb(id, val) { if(isAdmin) db.ref('bracket/'+id).set(val); }
    function updateConfig() { db.ref('config').set({ maxTeams: parseInt(document.getElementById('maxTeamsInput').value) }); }
    function nukeAll() { if(confirm("CLEAR ALL DATA?")) db.ref('/').set(null).then(()=>location.reload()); }

    // RANKING SYSTEM FUNCTIONS
    function addRankedTeam() {
        const team = document.getElementById('newRankTeam').value.trim();
        const wins = parseInt(document.getElementById('newRankWins').value) || 0;
        if(team && isAdmin) {
            const teamId = team.replace(/\s+/g, '_').toLowerCase();
            db.ref('leaderboard/' + teamId).set({ team: team, wins: wins });
            document.getElementById('newRankTeam').value = '';
            document.getElementById('newRankWins').value = '';
        }
    }

    function updateWins(teamId, currentWins, amount) {
        if(isAdmin) db.ref('leaderboard/' + teamId).update({ wins: Math.max(0, currentWins + amount) });
    }

    function deleteRank(teamId) {
        if(isAdmin && confirm("Purge this squad from records?")) db.ref('leaderboard/' + teamId).remove();
    }

    function renderLeaderboard(data) {
        const body = document.getElementById('leaderboard-body'); 
        body.innerHTML = '';
        const items = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a,b) => b.wins - a.wins);
        items.forEach((item, i) => {
            body.innerHTML += `
                <tr>
                    <td>#${i+1}</td>
                    <td>${item.team}</td>
                    <td>${item.wins}</td>
                    <td>
                        <div class="admin-only" style="display:${isAdmin ? 'flex' : 'none'}; gap:5px;">
                            <button onclick="updateWins('${item.id}', ${item.wins}, 1)" style="background:#0a4; color:white; border:none; padding:4px; cursor:pointer;">+</button>
                            <button onclick="updateWins('${item.id}', ${item.wins}, -1)" style="background:#822; color:white; border:none; padding:4px; cursor:pointer;">-</button>
                            <button onclick="deleteRank('${item.id}')" style="background:transparent; color:red; border:1px solid red; padding:4px; cursor:pointer; font-size:10px;">X</button>
                        </div>
                    </td>
                </tr>`;
        });
    }

    function checkRegStatus(data) {
        let count = 0;
        const matchesR1 = currentConfig.maxTeams / 2;
        for(let m=1; m<=matchesR1; m++) {
            if(data[`w1-m${m}-t1`]) count++;
            if(data[`w1-m${m}-t2`]) count++;
        }
        const left = currentConfig.maxTeams - count;
        document.getElementById('spotsLeft').innerText = left + " UNITS REMAINING";
        document.getElementById('regBox').style.display = (left <= 0) ? 'none' : 'block';
    }

    async function registerTeam() {
        const email = document.getElementById('regEmail').value.trim();
        const team = document.getElementById('regTeamName').value.trim();
        if(document.getElementById('regPass').value !== "player123") return alert("Invalid Access Code");
        try {
            const userCred = await auth.createUserWithEmailAndPassword(email, "TempPass123!");
            await userCred.user.sendEmailVerification();
            await db.ref('pending/' + userCred.user.uid).set({ team: team, registered: false });
            alert("Verification Sent. Check your comms (email) to confirm enrollment.");
        } catch (e) { alert(e.message); }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-screen');
        document.getElementById('btn-'+id.split('-')[0]).classList.add('active');
    }

    db.ref('config').on('value', snap => { if(snap.exists()) currentConfig = snap.val(); });
    db.ref('bracket').on('value', snap => renderBracket(snap.val() || {}));
    db.ref('leaderboard').on('value', snap => renderLeaderboard(snap.val() || {}));
</script>
</body>
</html>
