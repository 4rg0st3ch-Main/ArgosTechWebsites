<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Arena - Tournament System</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script> -->

<!-- Use modular SDK -->
<script type="module">

// Import Firebase functions
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

// Your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyB_gfXGMoTrIvFANPx2tI0qrR7fuhv5eVA",
  authDomain: "blastwarfaredataserver.firebaseapp.com",
  projectId: "blastwarfaredataserver",
  storageBucket: "blastwarfaredataserver.firebasestorage.app",
  messagingSenderId: "1045300741469",
  appId: "1:1045300741469:web:bee0a89a2ffd9f5b9a14b4"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Global variables
let isAdmin = false;
let currentConfig = { maxTeams: 4 };

// Helper functions for Firebase interactions

// Listening to leaderboard
const leaderboardRef = ref(db, 'leaderboard');
onValue(leaderboardRef, (snapshot) => {
  renderLeaderboard(snapshot.val() || {});
});

// Listening to bracket
const bracketRef = ref(db, 'bracket');
onValue(bracketRef, (snapshot) => {
  renderBracket(snapshot.val() || {});
});

// Listening to config
const configRef = ref(db, 'config');
onValue(configRef, (snapshot) => {
  if (snapshot.exists()) {
    currentConfig = snapshot.val();
  }
});

// Authentication state
onAuthStateChanged(auth, async (user) => {
  if (user && user.emailVerified) {
    // Check pending registration
    const pendingRef = ref(db, 'pending/' + user.uid);
    const snap = await get(pendingRef);
    const data = snap.val();
    if (data && data.registered === false) {
      const bracketSnap = await get(ref(db, 'bracket'));
      const bData = bracketSnap.val() || {};
      const firstRoundMatches = currentConfig.maxTeams / 2;
      let foundSlot = null;
      for (let m=1; m <= firstRoundMatches; m++) {
        if (!bData[`w1-m${m}-t1`]) { foundSlot = `w1-m${m}-t1`; break; }
        if (!bData[`w1-m${m}-t2`]) { foundSlot = `w1-m${m}-t2`; break; }
      }
      if (foundSlot) {
        await set(ref(db, 'bracket/' + foundSlot), data.team);
        await update(pendingRef, { registered: true });
        alert("Deployment Successful: " + data.team + " is in the bracket.");
      } else {
        alert("Tournament at capacity.");
      }
    }
  }
});

// --- Your existing functions, now using modular Firebase ---

// Register team
window.registerTeam = async function() {
  const email = document.getElementById('regEmail').value.trim();
  const team = document.getElementById('regTeamName').value.trim();
  if (document.getElementById('regPass').value !== "player123") return alert("Invalid Access Code");
  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, "TempPass123!");
    await sendEmailVerification(userCred.user);
    await set(ref(db, 'pending/' + userCred.user.uid), { team: team, registered: false });
    alert("Verification Sent. Check your email to confirm enrollment.");
  } catch (e) {
    alert(e.message);
  }
};

// Render leaderboard
function renderLeaderboard(data) {
  const body = document.getElementById('leaderboard-body');
  body.innerHTML = '';
  const items = Object.keys(data).map(k => ({ id: k, ...data[k] })).sort((a,b) => b.wins - a.wins);
  items.forEach((item, i) => {
    body.innerHTML += `
      <tr>
        <td>#${i+1}</td>
        <td>${item.team}</td>
        <td>${item.wins}</td>
        <td>
          <div class="admin-only" style="display:${isAdmin?'flex':'none'}; gap:5px;">
            <button onclick="updateWins('${item.id}', ${item.wins}, 1)" style="background:#0a4; color:white; border:none; padding:4px; cursor:pointer;">+</button>
            <button onclick="updateWins('${item.id}', ${item.wins}, -1)" style="background:#822; color:white; border:none; padding:4px; cursor:pointer;">-</button>
            <button onclick="deleteRank('${item.id}')" style="background:transparent; color:red; border:1px solid red; padding:4px; cursor:pointer; font-size:10px;">X</button>
          </div>
        </td>
      </tr>`;
  });
}

// Update wins
window.updateWins = async function(teamId, currentWins, amount) {
  if (isAdmin) {
    const teamRef = ref(db, 'leaderboard/' + teamId);
    const snap = await get(teamRef);
    if (snap.exists()) {
      const data = snap.val();
      await set(teamRef, { team: data.team, wins: Math.max(0, currentWins + amount) });
    }
  }
};

// Delete rank
window.deleteRank = async function(teamId) {
  if (isAdmin && confirm("Purge this squad from records?")) {
    await set(ref(db, 'leaderboard/' + teamId), null);
  }
};

// Move function (admin)
window.move = async function(from, to) {
  if (isAdmin) {
    const fromRef = ref(db, 'bracket/' + from);
    const snap = await get(fromRef);
    if (snap.exists()) {
      await set(ref(db, 'bracket/' + to), snap.val());
    }
  }
};

// Update database
window.updateDb = async function(id, val) {
  if (isAdmin) {
    await set(ref(db, 'bracket/' + id), val);
  }
};

// Update config
window.updateConfig = async function() {
  await set(ref(db, 'config'), { maxTeams: parseInt(document.getElementById('maxTeamsInput').value) });
};

// Wipe all data
window.nukeAll = async function() {
  if (confirm("CLEAR ALL DATA?")) {
    await set(ref(db, '/'), null);
    location.reload();
  }
};

// Render bracket
function renderBracket(data) {
  const area = document.getElementById('dynamic-bracket-area');
  area.innerHTML = '';

  // helper function to create sections
  function createSection(parent, title, prefix, data, isLosers) {
    const h = document.createElement('h2'); h.innerText = title; parent.appendChild(h);
    const container = document.createElement('div'); container.className = 'round-container';
    const totalRds = Math.log2(currentConfig.maxTeams);
    const loopRds = isLosers ? totalRds - 1 : totalRds;
    for (let r=1; r<=loopRds; r++) {
      const rd = document.createElement('div'); rd.className = 'round';
      rd.innerHTML = `<h3>Round ${r}</h3>`;
      const matches = Math.pow(2, totalRds - r) / (isLosers ? 2 : 1);
      for (let m=1; m<=Math.max(matches,1); m++) {
        const mid = `${prefix}${r}-m${m}`;
        const mDiv = document.createElement('div'); mDiv.className = 'matchup';
        [1,2].forEach(t => {
          const id = `${mid}-t${t}`;
          const slot = document.createElement('div'); slot.className='slot';
          slot.style.display='flex'; slot.style.alignItems='center'; slot.style.gap='5px';
          let nextM = Math.ceil(m/2); let nextT = (m % 2 === 0) ? 2 : 1;
          let nextPath = `${prefix}${r+1}-m${nextM}-t${nextT}`;
          let toPath = isLosers ? 'l' : 'w';
          let path = (r===totalRds || (isLosers && r===totalRds-1)) ? 'gf' : nextPath;
          path = `${toPath}${m}-${t}`;
          slot.innerHTML = `
            <input type="text" id="${id}" value="${data[id]||''}" onchange="updateDb('${id}', this.value)">
            <div class="admin-only" style="display:${isAdmin?'flex':'none'}; gap:2px;">
              <button class="win-btn" style="background:#0a4; color:white; border:none; padding:4px; cursor:pointer;" onclick="move('${id}', '${nextPath}')">W</button>
              ${!isLosers ? `<button class="lose-btn" style="background:#822; color:white; border:none; padding:4px; cursor:pointer;" onclick="move('${id}', 'l${m}-t${t}')">L</button>` : ''}
            </div>
          `;
          mDiv.appendChild(slot);
        });
        rd.appendChild(mDiv);
      }
      container.appendChild(rd);
    }
    parent.appendChild(container);
  }

  // create sections
  createSection(area, "Winners Circle", "w", data, false);
  createSection(area, "Redemption", "l", data, true);

  // Grand Final
  const gfHeader = document.createElement('h2');
  gfHeader.innerText = "Grand Final";
  gfHeader.style.borderColor = "white";
  area.appendChild(gfHeader);

  const gfBox = document.createElement('div');
  gfBox.className = "matchup";
  gfBox.style.width = "280px";
  gfBox.innerHTML = `
    <div class="slot"><input type="text" id="gf-t1" value="${data['gf-t1']||''}" placeholder="Winner Side" onchange="updateDb('gf-t1', this.value)"></div>
    <div style="text-align:center; font-size:10px; color:#444; margin:10px 0; letter-spacing:2px;">TERMINATION PHASE</div>
    <div class="slot"><input type="text" id="gf-t2" value="${data['gf-t2']||''}" placeholder="Loser Side" onchange="updateDb('gf-t2', this.value)"></div>
  `;
  area.appendChild(gfBox);
}

// Show screen function
window.showScreen = function(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active-screen');
  document.getElementById('btn-'+id.split('-')[0]).classList.add('active');
};

// Check admin pass
window.checkPass = function() {
  if (document.getElementById('passInput').value === "strider101") {
    isAdmin = true;
    document.querySelectorAll('.admin-only').forEach(el => el.style.display='flex');
  }
};

// Move database
window.move = function(from, to) {
  if (isAdmin) {
    get(ref(db, 'bracket/' + from)).then(snap => {
      if (snap.exists()) {
        set(ref(db, 'bracket/' + to), snap.val());
      }
    });
  }
};

// Update database
window.updateDb = function(id, val) {
  if (isAdmin) {
    set(ref(db, 'bracket/' + id), val);
  }
};

// Update config
window.updateConfig = function() {
  set(ref(db, 'config'), { maxTeams: parseInt(document.getElementById('maxTeamsInput').value) });
};

// Nuke all data
window.nukeAll = function() {
  if (confirm("CLEAR ALL DATA?")) {
    set(ref(db, '/'), null).then(() => location.reload());
  }
};

</script>

<style>

</head>
<body id="mainBody">

<div class="admin-bar" id="adminBar" style="display:none;">

<div id="leaderboard-screen" class="screen" style="display:none;">

    <div class="admin-only" style="display:none; flex-direction:column; gap:10px; margin-bottom:20px; padding:15px; border:1px solid var(--neon-blue); background:rgba(0,255,255,0.05);">
      <h3 style="color:var(--neon-blue); margin-top:0;">Manual Rank Override</h3>

    <table style="width:100%">

  </div>
</div>

<div class="register-box" id="regBox" style="display:none;">
  <button class="min-toggle" onclick="toggleMin()">▼</button>
  <h3 style="margin:0 0 15px 0; color:var(--neon-purple); text-align:center;">SQUAD ENROLLMENT</h3>
  <div id="regContent">
    <input type="text" id="regTeamName" placeholder="Callsign" style="margin-bottom:8px; width:90%;" />
    <input type="email" id="regEmail" placeholder="Comms Email" style="margin-bottom:8px; width:90%;" />
    <input type="password" id="regPass" placeholder="Access Code" style="margin-bottom:8px; width:90%;" />
    <button class="reg-btn" onclick="registerTeam()">Deploy Squad</button>
    <div class="spots-counter" id="spotsLeft" style="font-size:9px; margin-top:10px; text-align:center; color:#555;">SCANNING SLOTS...</div>
  </div>
</div>

<script>
  // Your existing scripts, initialization, event handlers, etc.

  // Initialize system
  function init() {
    document.getElementById('splash').style.display='none';
    document.getElementById('mainNav').style.display='flex';
    document.getElementById('adminBar').style.display='flex';
    document.getElementById('regBox').style.display='block';
    createGrid();
    const music = document.getElementById('bgMusic');
    music.volume=0.15;
    music.play().catch(()=>console.log("Audio blocked"));
  }

  // Toggle registration box
  function toggleMin() {
    const box = document.getElementById('regBox');
    const content = document.getElementById('regContent');
    const btn = document.querySelector('.min-toggle');
    if (box.classList.contains('minimized')) {
      box.classList.remove('minimized');
      content.style.display='block';
      btn.innerText='▼';
    } else {
      box.classList.add('minimized');
      content.style.display='none';
      btn.innerText='▲';
    }
  }

  // Create laser grid and targets
  function createGrid() {
    const container = document.getElementById('laser-container');
    for (let i=0; i<25; i++) {
      let line = document.createElement('div');
      line.className='grid-line';
      line.style.width='1px';
      line.style.height='100%';
      line.style.left=(i*4)+'%';
      container.appendChild(line);
    }
    for (let i=0; i<6; i++) {
      let target=document.createElement('div');
      target.className='targeting-reticle';
      target.style.top=Math.random()*80+'%';
      target.style.left=Math.random()*80+'%';
      target.style.animationDelay=(i*1.5)+'s';
      container.appendChild(target);
    }
  }

  // show screen
  window.showScreen=function(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active-screen'));
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active-screen');
    document.getElementById('btn-'+id.split('-')[0]).classList.add('active');
  }

  // check admin password
  window.checkPass=function() {
    if (document.getElementById('passInput').value==='strider101') {
      isAdmin=true;
      document.querySelectorAll('.admin-only').forEach(el=>el.style.display='flex');
    }
  }

  // Add your other functions (renderLeaderboard, renderBracket, etc.) here, adapted for modular SDK

  // --- Your existing functions, converted ---

  // Add Rank
  window.addRankedTeam=function() {
    const team=document.getElementById('newRankTeam').value.trim();
    const wins=parseInt(document.getElementById('newRankWins').value)||0;
    if(team && isAdmin) {
      const teamId=team.replace(/\s+/g,'_').toLowerCase();
      set(ref(db, 'leaderboard/' + teamId), { team: team, wins: wins });
      document.getElementById('newRankTeam').value='';
      document.getElementById('newRankWins').value='';
    }
  }

  // Render leaderboard
  function renderLeaderboard(data) {
    const tbody=document.getElementById('leaderboard-body');
    tbody.innerHTML='';
    const items=Object.keys(data).map(k=>({id:k,...data[k]})).sort((a,b)=>b.wins - a.wins);
    items.forEach((item,i)=>{
      tbody.innerHTML+=`
        <tr>
          <td>#${i+1}</td>
          <td>${item.team}</td>
          <td>${item.wins}</td>
          <td>
            <div class="admin-only" style="display:${isAdmin?'flex':'none'}; gap:5px;">
              <button onclick="updateWins('${item.id}', ${item.wins}, 1)" style="background:#0a4; color:white; border:none; padding:4px; cursor:pointer;">+</button>
              <button onclick="updateWins('${item.id}', ${item.wins}, -1)" style="background:#822; color:white; border:none; padding:4px; cursor:pointer;">-</button>
              <button onclick="deleteRank('${item.id}')" style="background:transparent; color:red; border:1px solid red; padding:4px; cursor:pointer; font-size:10px;">X</button>
            </div>
          </td>
        </tr>`;
    });
  }

  // Update Wins
  window.updateWins=async function(id,wins,delta){
    if(isAdmin){
      const snap=await get(ref(db, 'leaderboard/'+id));
      if(snap.exists()){
        const data=snap.val();
        set(ref(db, 'leaderboard/'+id), { team: data.team, wins: Math.max(0,wins+delta) });
      }
    }
  }

  // Delete rank
  window.deleteRank=async function(id){
    if(isAdmin && confirm("Purge this squad from records?")){
      await set(ref(db, 'leaderboard/'+id), null);
    }
  }

  // Render bracket
  function renderBracket(data){
    // your existing renderBracket code, using modular SDK
    const area=document.getElementById('dynamic-bracket-area');
    area.innerHTML='';
    // ... all your original render logic ...
  }

  // Register team
  window.registerTeam=async function(){
    const email=document.getElementById('regEmail').value.trim();
    const team=document.getElementById('regTeamName').value.trim();
    if(document.getElementById('regPass').value!=='player123') return alert("Invalid Access Code");
    try{
      const userCred=await createUserWithEmailAndPassword(auth,email,"TempPass123!");
      await sendEmailVerification(userCred.user);
      await set(ref(db,'pending/'+userCred.user.uid),{team:team,registered:false});
      alert("Verification Sent. Check your email to confirm enrollment.");
    } catch(e){
      alert(e.message);
    }
  }

  // Initialize
  window.init=function(){
    document.getElementById('splash').style.display='none';
    document.getElementById('mainNav').style.display='flex';
    document.getElementById('adminBar').style.display='flex';
    document.getElementById('regBox').style.display='block';
    createGrid();
    document.getElementById('bgMusic').volume=0.15;
    document.getElementById('bgMusic').play().catch(()=>console.log("Audio blocked"));
  }

  // Additional functions: showScreen, toggleMin, createGrid, etc. are as before, no changes needed.

</script>
</body>
